<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Эдитс Фан">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Эдитс Фан">
<title>Эдитс Фан</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none}
input,textarea,select{font-size:16px;user-select:text}

.hdr{height:50px;background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #222;flex-shrink:0;padding-top:env(safe-area-inset-top)}
.logo{font-weight:900;font-size:17px;background:linear-gradient(45deg,#ff0050,#00f2ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-btn{background:#222;border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}

.main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;height:calc(100dvh - 50px - 58px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.tab{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tab.active{display:block}

.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.vcard{height:100%;scroll-snap-align:start;position:relative;background:#111}
.vcard video{width:100%;height:100%;object-fit:cover;background:#000}
.vph{width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;font-size:60px;opacity:.3}
.vinfo{position:absolute;bottom:70px;left:12px;right:72px;z-index:2}
.vauthor{font-weight:700;font-size:15px;margin-bottom:4px}
.vdesc{font-size:13px;opacity:.9;line-height:1.4}
.vmusic{font-size:12px;margin-top:6px;opacity:.8}
.vacts{position:absolute;right:8px;bottom:80px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:2}
.vact{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer}
.vact .ic{width:42px;height:42px;background:rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.vact.liked .ic{color:#ff0050}
.vav{width:44px;height:44px;border-radius:50%;background:linear-gradient(45deg,#ff0050,#00f2ea);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;border:2px solid #fff;margin-bottom:6px}

.btn{padding:11px;border:none;border-radius:8px;font-weight:700;font-size:14px;width:100%;margin-top:8px;cursor:pointer}
.btn-p{background:#ff0050;color:#fff}
.btn-s{background:#222;color:#fff}
.btn-g{background:#00f2ea;color:#000}

.nav{height:58px;background:#0a0a0a;border-top:1px solid #222;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666;font-size:10px;cursor:pointer;padding:4px 0}
.ni.active{color:#fff}
.ni .ic{font-size:22px;margin-bottom:2px}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.mc{background:#1a1a1a;padding:18px;border-radius:18px 18px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.mc h3{margin-bottom:12px;font-size:17px;text-align:center}
.mc input,.mc textarea{width:100%;padding:11px;margin:6px 0;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:8px;font-size:16px}
.handle{width:36px;height:4px;background:#444;border-radius:2px;margin:0 auto 12px}
.drop{border:2px dashed #444;border-radius:10px;padding:22px;text-align:center;margin:6px 0;cursor:pointer}
.drop.has{border-color:#00f2ea}
.cmt{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #222}
.cmt-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#ff0050,#00f2ea);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.cmt-author{font-size:12px;font-weight:700;margin-bottom:2px}
.cmt-text{font-size:13px}
.empty{text-align:center;padding:40px 20px;color:#666}
.empty .em{font-size:40px;margin-bottom:10px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-120px);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:300;transition:.3s;border:1px solid #333;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

.install-banner{position:fixed;top:0;left:0;right:0;background:#00f2ea;color:#000;padding:12px;text-align:center;font-weight:700;z-index:200;cursor:pointer;display:none}
.install-banner.show{display:block}
</style>
</head>
<body>

<div class="install-banner" id="installBanner" onclick="installApp()">📱 Установить приложение</div>

<div class="hdr">
  <div class="logo">ЭДИТС ФАН</div>
  <button class="hdr-btn" onclick="openUpload()">+</button>
</div>

<div class="main">
  <div class="tab active" id="t-feed"><div class="feed" id="feed"></div></div>
  <div class="tab" id="t-profile"><div style="padding:20px" id="profContent"></div></div>
</div>

<div class="nav">
  <div class="ni active" onclick="showTab('feed')"><div class="ic">🏠</div><div>Лента</div></div>
  <div class="ni" onclick="showTab('profile')"><div class="ic">👤</div><div>Я</div></div>
</div>

<div class="modal" id="uploadM">
  <div class="mc">
    <div class="handle"></div>
    <h3>📹 Новое видео</h3>
    <div class="drop" id="drop" onclick="document.getElementById('vfile').click()">
      <div>🎬 Выбери видео из галереи</div>
    </div>
    <input type="file" id="vfile" accept="video/*" style="display:none">
    <input id="vidDesc" placeholder="Описание...">
    <input id="vidMusic" placeholder="Музыка...">
    <button class="btn btn-p" onclick="publishVid()">Опубликовать</button>
    <button class="btn btn-s" onclick="closeModal('uploadM')">Отмена</button>
  </div>
</div>

<div class="modal" id="commentsM">
  <div class="mc">
    <div class="handle"></div>
    <h3>💬 Комментарии</h3>
    <div id="cmtsList" style="max-height:40vh;overflow-y:auto;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <input id="cmtInp" placeholder="Комментарий..." style="flex:1;margin:0">
      <button class="btn btn-p" style="width:auto;padding:11px 16px;margin:0" onclick="postCmt()">→</button>
    </div>
  </div>
</div>

<div class="modal" id="profileM">
  <div class="mc">
    <div class="handle"></div>
    <h3>👤 Профиль</h3>
    <input id="pName" placeholder="Никнейм">
    <button class="btn btn-p" onclick="saveProfile()">Сохранить</button>
    <button class="btn btn-s" onclick="closeModal('profileM')">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var me = null;
var myVideos = [];
var pickedFile = null;
var blobMap = {};
var curCommentId = null;
var likedSet = {};

var otherVideos = [
  {id:'o1', author:'ProEditor', desc:'Топовый эдит под фонк 🔥', music:'Phonk Vol.1', likes:1240, cmts:[{author:'CoolGuy',text:'Огонь! 🔥'},{author:'AnimeFan',text:'Как сделал переход?'}], url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4'},
  {id:'o2', author:'CoolGuy', desc:'Как я провел лето ☀️', music:'Summer Vibes', likes:456, cmts:[{author:'NightOwl',text:'Завидую 😍'}], url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'},
  {id:'o3', author:'AnimeFan', desc:'Наруто vs Луффи ⚔️', music:'The Rumbling', likes:8921, cmts:[{author:'ProEditor',text:'Лучший эдит недели'}], url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'},
  {id:'o4', author:'NightOwl', desc:'Ночной монтаж 🌙', music:'Midnight City', likes:234, cmts:[], url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'},
  {id:'o5', author:'EditMaster', desc:'Переходы уровня бог 🎬', music:'Sahara', likes:5678, cmts:[{author:'CoolGuy',text:'Гений!'}], url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4'}
];

function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function showTab(t){
  var tabs = document.querySelectorAll('.tab');
  var navs = document.querySelectorAll('.ni');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  for(var j=0;j<navs.length;j++) navs[j].classList.remove('active');
  var el = document.getElementById('t-' + t);
  if(el) el.classList.add('active');
  var idx = (t==='feed')?0:1;
  if(navs[idx]) navs[idx].classList.add('active');
  if(t==='feed') renderFeed();
  if(t==='profile') renderProfile();
}

function openModal(id){ var e=document.getElementById(id); if(e) e.classList.add('open'); }
function closeModal(id){ var e=document.getElementById(id); if(e) e.classList.remove('open'); }

function openUpload(){
  if(!me){
    toast('Сначала создай профиль!');
    showTab('profile');
    setTimeout(function(){ openModal('profileM'); }, 300);
    return;
  }
  pickedFile = null;
  document.getElementById('vfile').value = '';
  document.getElementById('vidDesc').value = '';
  document.getElementById('vidMusic').value = '';
  var d = document.getElementById('drop');
  d.classList.remove('has');
  d.innerHTML = '<div>🎬 Выбери видео из галереи</div>';
  openModal('uploadM');
}

document.getElementById('vfile').addEventListener('change', function(e){
  var f = e.target.files[0];
  if(!f) return;
  pickedFile = f;
  var d = document.getElementById('drop');
  d.classList.add('has');
  d.innerHTML = '<div>✅ ' + f.name + '</div><div style="font-size:12px;opacity:.6;margin-top:6px">' + (f.size/1048576).toFixed(1) + ' МБ</div>';
});

function publishVid(){
  if(!me){ toast('Создайте профиль!'); return; }
  if(!pickedFile){ toast('Выбери видео!'); return; }
  var desc = document.getElementById('vidDesc').value.trim();
  var music = document.getElementById('vidMusic').value.trim();
  if(!desc){ toast('Введи описание!'); return; }

  var id = 'my' + Date.now();
  myVideos.unshift({id:id, author:me.name, desc:desc, music:music||'Original Sound', likes:0, cmts:[]});
  try{ blobMap[id] = URL.createObjectURL(pickedFile); }catch(e){}

  closeModal('uploadM');
  renderFeed();
  showTab('feed');
  toast('Опубликовано! 🎉');
}

function renderFeed(){
  var feed = document.getElementById('feed');
  if(!feed) return;

  var all = [];
  var i;
  for(i=0;i<myVideos.length;i++) all.push(myVideos[i]);
  for(i=0;i<otherVideos.length;i++) all.push(otherVideos[i]);

  if(all.length===0){
    feed.innerHTML = '<div class="empty"><div class="em">🎬</div><h3>Нет видео</h3></div>';
    return;
  }

  var html = '';
  for(i=0;i<all.length;i++){
    var v = all[i];
    var src = v.url ? v.url : (blobMap[v.id] ? blobMap[v.id] : '');
    var liked = likedSet[v.id] ? true : false;
    var likeCount = v.likes + (liked?1:0);

    html += '<div class="vcard" data-id="' + v.id + '">';
    if(src){
      html += '<video src="' + src + '" loop playsinline preload="auto" muted></video>';
    } else {
      html += '<div class="vph">▶</div>';
    }
    html += '<div class="vinfo">';
    html += '<div class="vauthor">@' + v.author + '</div>';
    html += '<div class="vdesc">' + v.desc + '</div>';
    html += '<div class="vmusic">🎵 ' + v.music + '</div>';
    html += '</div>';
    html += '<div class="vacts">';
    html += '<div class="vav">' + v.author.charAt(0).toUpperCase() + '</div>';
    html += '<div class="vact ' + (liked?'liked':'') + '" onclick="toggleLike(\'' + v.id + '\')">';
    html += '<div class="ic">❤</div><div>' + likeCount + '</div></div>';
    html += '<div class="vact" onclick="openComments(\'' + v.id + '\')">';
    html += '<div class="ic">💬</div><div>' + v.cmts.length + '</div></div>';
    html += '<div class="vact"><div class="ic">↗</div><div>0</div></div>';
    html += '</div></div>';
  }
  feed.innerHTML = html;
  setupPlay();
}

function setupPlay(){
  var cards = document.querySelectorAll('.vcard');
  if(window.IntersectionObserver){
    var obs = new IntersectionObserver(function(entries){
      for(var i=0;i<entries.length;i++){
        var e = entries[i];
        var v = e.target.querySelector('video');
        if(!v) continue;
        if(e.isIntersecting && e.intersectionRatio >= 0.6){
          v.play();
        } else {
          v.pause();
        }
      }
    }, {threshold:[0,0.6,1]});
    for(var c=0;c<cards.length;c++) obs.observe(cards[c]);
  } else {
    var vids = document.querySelectorAll('.vcard video');
    if(vids[0]) vids[0].play();
  }
}

function findVideo(id){
  var i;
  for(i=0;i<myVideos.length;i++) if(myVideos[i].id===id) return myVideos[i];
  for(i=0;i<otherVideos.length;i++) if(otherVideos[i].id===id) return otherVideos[i];
  return null;
}

function toggleLike(id){
  if(likedSet[id]){ delete likedSet[id]; } else { likedSet[id] = true; }
  renderFeed();
}

function openComments(id){
  curCommentId = id;
  var v = findVideo(id);
  var list = document.getElementById('cmtsList');
  if(!v || v.cmts.length===0){
    list.innerHTML = '<div class="empty">Нет комментариев</div>';
  } else {
    var h = '';
    for(var i=0;i<v.cmts.length;i++){
      var c = v.cmts[i];
      h += '<div class="cmt"><div class="cmt-av">' + c.author.charAt(0).toUpperCase() + '</div>';
      h += '<div><div class="cmt-author">@' + c.author + '</div><div class="cmt-text">' + c.text + '</div></div></div>';
    }
    list.innerHTML = h;
  }
  openModal('commentsM');
}

function postCmt(){
  if(!me){ toast('Создайте профиль!'); return; }
  var inp = document.getElementById('cmtInp');
  var text = inp.value.trim();
  if(!text) return;
  var v = findVideo(curCommentId);
  if(!v) return;
  v.cmts.push({author:me.name, text:text});
  inp.value = '';
  openComments(curCommentId);
  renderFeed();
}

function renderProfile(){
  var c = document.getElementById('profContent');
  if(!c) return;
  if(!me){
    c.innerHTML = '<div class="empty"><div class="em">👤</div><h3>Профиль не создан</h3><button class="btn btn-p" style="max-width:200px;margin:15px auto" onclick="openModal(\'profileM\')">Создать</button></div>';
    return;
  }
  var html = '<div style="text-align:center;padding:20px">';
  html += '<div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(45deg,#ff0050,#00f2ea);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 10px">' + me.name.charAt(0).toUpperCase() + '</div>';
  html += '<h2>@' + me.name + '</h2>';
  html += '<button class="btn btn-s" style="max-width:200px;margin:12px auto" onclick="openModal(\'profileM\')">Редактировать</button>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-around;padding:12px;background:#151515;border-radius:10px">';
  html += '<div style="text-align:center"><div style="font-size:18px;font-weight:700">' + myVideos.length + '</div><div style="font-size:10px;color:#888">Мои видео</div></div>';
  html += '<div style="text-align:center"><div style="font-size:18px;font-weight:700">' + otherVideos.length + '</div><div style="font-size:10px;color:#888">Других</div></div>';
  html += '</div>';
  c.innerHTML = html;
}

function saveProfile(){
  var name = document.getElementById('pName').value.trim();
  if(!name){ toast('Введи имя!'); return; }
  if(!me){ me = {id:'u'+Date.now(), name:name}; } else { me.name = name; }
  closeModal('profileM');
  renderProfile();
  toast('Сохранено!');
}

document.getElementById('feed').addEventListener('click', function(ev){
  var card = ev.target.closest ? ev.target.closest('.vcard') : null;
  if(!card) return;
  if(ev.target.closest && (ev.target.closest('.vact') || ev.target.closest('.vinfo'))) return;
  var v = card.querySelector('video');
  if(!v) return;
  if(v.paused){ v.play(); } else { v.pause(); }
});

var deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choiceResult){
      if(choiceResult.outcome === 'accepted'){
        toast('Приложение установлено!');
      }
      deferredPrompt = null;
    });
  }
  document.getElementById('installBanner').classList.remove('show');
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

window.onload = function(){
  renderFeed();
  setTimeout(function(){ if(!me) toast('Создай профиль во вкладке «Я»'); }, 1200);
};
</script>
</body>
</html>
